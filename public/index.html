<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Store</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">General<em>Store</em></a>
      <form id="search-form" class="search" role="search">
        <input id="search-input" type="text" placeholder="Search products…" autocomplete="off" />
      </form>
      <div class="header-actions">
        <div id="site-nav"></div>
        <button id="cart-button" class="cart-button" type="button">
          Cart <span id="cart-count" class="badge-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav id="category-bar" class="category-bar" aria-label="Categories"></nav>

  <main class="store-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 id="heading">All products</h1>
          <p id="heading-sub" class="sub"></p>
        </div>
        <select id="sort-select" aria-label="Sort products">
          <option value="newest">Newest first</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <section id="products" class="product-grid" aria-live="polite"></section>
      <div id="empty-state" class="empty-state hidden">
        <div class="big">🔍</div>
        <h2>Nothing found</h2>
        <p class="muted">Try a different search term or category.</p>
      </div>
    </div>
  </main>

  <!-- Product detail modal -->
  <div id="product-modal" class="overlay center hidden">
    <div id="product-detail" class="modal wide"></div>
  </div>

  <!-- Cart drawer -->
  <div id="cart-overlay" class="overlay right hidden">
    <aside id="cart-panel" class="drawer" role="dialog" aria-label="Shopping cart"></aside>
  </div>

  <!-- Order confirmation -->
  <div id="confirm-overlay" class="overlay center hidden">
    <div id="confirm-box" class="modal"></div>
  </div>

  <script type="module" src="/auth.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
